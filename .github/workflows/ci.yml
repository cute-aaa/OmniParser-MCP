name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show versions
        run: |
          python --version
          python -c "import mcp, httpx; print('mcp', getattr(mcp, '__version__', '?'), '| httpx', httpx.__version__)"

      - name: Syntax check
        run: python -m compileall -q omniparser_mcp.py test_mcp.py test_ci_smoke.py test_direct.py

      - name: Direct unit tests (no subprocess)
        run: python test_direct.py

      - name: Import check
        run: python -c "import omniparser_mcp; print('omniparser_mcp import ok')"

      - name: Stdio smoke test
        shell: bash
        run: |
          set -o pipefail
          python -u test_ci_smoke.py 2>&1 | tee smoke_test.log

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.python-version }}
          path: smoke_test.log
          if-no-files-found: ignore
